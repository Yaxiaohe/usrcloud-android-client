plugins { id 'com.android.application' }

/* 【v0.36 修订五】编译时间戳。
   版本号一直停在 0.36（用户要求不升），所以每次重新打包出来的 APK 在手机上
   长得一模一样，说不清装的是哪一版 —— 这轮就吃了这个亏：
   三个问题报上来，实际看的是上一版的包。
   这里把打包时刻写进 BuildConfig，关于页显示出来，一眼就能对上。 */
def buildStamp = new java.text.SimpleDateFormat("MMdd-HHmm").format(new Date())

android {
    namespace 'org.usrcloud.xunjian'
    compileSdk 34

    defaultConfig {
        applicationId "org.usrcloud.xunjian"
        minSdk 21
        targetSdk 33
        versionCode 10336
        versionName "0.36"
        buildConfigField "String", "BUILD_STAMP", "\"${buildStamp}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            // 签名密钥不进仓库（见 .gitignore）。没有密钥时用 debug 签名兜底，
            // 保证 clone 下来就能 assembleRelease，只是装不到别人已装的旧包上。
            def ks = file("../keystore/usrcloud.jks")
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv("USRCLOUD_STORE_PWD") ?: "usrcloud2026"
                keyAlias "usrcloud"
                keyPassword System.getenv("USRCLOUD_KEY_PWD") ?: "usrcloud2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // 没有自己的密钥时用 debug 签名兜底，避免打出装不上的未签名包
            signingConfig file("../keystore/usrcloud.jks").exists()
                    ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            signingConfig file("../keystore/usrcloud.jks").exists()
                    ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        /* 源码里有中文注释，不声明 UTF-8 的话 javac 会按平台默认编码读，
           Windows 中文版是 GBK，中文注释里的全角标点全被当成非法字符 ——
           v0.22 首次构建就因此报 30 个「非法字符」。 */
        encoding = 'UTF-8'
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    // 只需 core（FileProvider）；不用 appcompat —— 本 App 用原生 Activity + WebView，
    // 引 appcompat 会带进 kotlin-stdlib-jdk7/jdk8 并与 stdlib 重复声明同一批类。
    implementation 'androidx.core:core:1.12.0'
}
