org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.parallel=true
org.gradle.caching=true

# 【为什么需要这一行】工程目录路径若含非 ASCII 字符（比如中文），
# Android Gradle Plugin 默认直接拒绝构建：
#   "Your project path contains non-ASCII characters.
#    This will most likely cause the build to fail on Windows."
# 这是 AGP 官方提供的开关（见 http://b.android.com/95744）。
# 加上之后实测 assembleRelease 能正常出包，签名与 assets 校验也都过了。
android.overridePathCheck=true
